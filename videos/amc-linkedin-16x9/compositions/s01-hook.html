        <script>
          (function () {
            const K = 1920 / 1600;
            // Puts UI point (fx, fy) at canvas point (cx, cy). The left edge may run past the footage because the scrim covers it; only top and bottom are clamped.
            const cam = (fx, fy, s, cx = 1350, cy = 540) => {
              const loY = cy / (K * s), hiY = 900 - (1080 - cy) / (K * s);
              if (loY <= hiY) fy = Math.min(Math.max(fy, loY), hiY);
              return { x: cx - fx * K * s, y: cy - fy * K * s, scale: s };
            };
            const tl = gsap.timeline({ paused: true });

            const shots = [
              ["#s01-c1", 0, 0.95, cam(390, 290, 1.7), cam(390, 290, 1.9)],
              ["#s01-c2", 0.95, 0.8, cam(400, 290, 1.85), cam(400, 290, 1.65)],
              ["#s01-c3", 1.75, 0.85, cam(1200, 400, 1.7), cam(1230, 430, 1.85)],
              ["#s01-c4", 2.6, 0.9, cam(430, 390, 1.6), cam(430, 390, 1.78)],
              ["#s01-c5", 3.5, 1.0, cam(1240, 330, 1.7), cam(1240, 400, 1.85)],
            ];
            shots.forEach(([sel, t, d, a, b]) => {
              tl.fromTo(sel, a, { ...b, duration: d, ease: "power1.out" }, t);
              if (t > 0) tl.fromTo("#s01-flash", { opacity: 0.16 }, { opacity: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
            });

            tl.fromTo("#s01-kicker", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.05);

            const slam = (sel, t) => {
              tl.fromTo(`${sel} .ln`, { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out", stagger: 0.07 }, t);
              const land = t + 0.36;
              tl.to("#s01-stage", { x: 7, y: -4, duration: 1 / 30, ease: "power2.out" }, land);
              tl.to("#s01-stage", { x: -5, y: 3, duration: 1 / 30, ease: "power2.out" }, land + 1 / 30);
              tl.to("#s01-stage", { x: 0, y: 0, duration: 1 / 30, ease: "power2.out" }, land + 2 / 30);
            };
            tl.set("#s01-l2 .ln", { opacity: 0 }, 0);
            slam("#s01-l1", 0.04);
            tl.to("#s01-l1 .ln", { y: -70, opacity: 0, duration: 0.2, ease: "power3.in", stagger: 0.03 }, 1.42);
            slam("#s01-l2", 1.62);
            tl.to("#s01-l2 .ln", { yPercent: -40, opacity: 0, duration: 0.22, ease: "power3.in", stagger: 0.03 }, 4.24);
            tl.to("#s01-kicker", { opacity: 0, duration: 0.2 }, 4.28);

            window.__timelines["s01-hook"] = tl;
