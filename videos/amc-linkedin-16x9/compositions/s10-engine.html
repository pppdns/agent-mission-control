        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            tl.fromTo("#s10-band .chap", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0);
            tl.fromTo("#s10-band .w", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power4.out", stagger: 0.04 }, 0.05);
            tl.fromTo("#s10-band .sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.4);

            tl.fromTo("#s10-label", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
            tl.fromTo("#s10-harness", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.2);
            tl.fromTo(".s10-wb", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out", stagger: 0.07 }, 0.55);
            tl.fromTo(".s10-dep", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 }, 0.65);
            tl.fromTo("#s10-w-ev", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.0);
            tl.fromTo("#s10-wl-ev", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.15);
            tl.fromTo("#s10-log", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.1);
            tl.fromTo("#s10-w-sse", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.4);
            tl.fromTo("#s10-wl-sse", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.55);
            tl.fromTo("#s10-ui", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.5);

            // Calls go down to providers and tools, results come back up.
            document.querySelectorAll(".s10-wd").forEach((d, i) => {
              tl.fromTo(d, { y: 0, opacity: 1 }, { y: 84, duration: 0.5, ease: "power1.inOut", yoyo: true, repeat: 7, immediateRender: false }, 1.2 + i * 0.17);
            });

            const EVENTS = [
              ["run.classified", "#e8f1ff"], ["agent.spawned", "#4fd1e6"], ["routing.decided", "#f0986f"],
              ["tool.requested", "#4fd1e6"], ["source.added", "#4fd1e6"], ["agent.message_sent", "#ff6b5a"],
              ["context.compacted", "#9be564"], ["evaluation.completed", "#c792ea"], ["loop.started", "#c792ea"],
              ["hitl.requested", "#ffb547"], ["checkpoint.created", "#8896a6"], ["artifact.updated", "#ffb547"],
            ];
            const host = document.getElementById("s10-pills");
            const rows = document.getElementById("s10-rows");
            const seqEl = document.getElementById("s10-seq");
            const seq = { v: 0 };
            const T0 = 1.9, GAP = 0.45;
            EVENTS.forEach(([name, color], i) => {
              const p = document.createElement("div");
              p.className = "s10-pill";
              p.setAttribute("data-layout-allow-overlap", "");
              p.textContent = name;
              p.style.color = color;
              p.style.borderColor = color;
              host.appendChild(p);
              const row = document.createElement("div");
              row.className = "s10-row";
              row.style.color = color;
              row.innerHTML = "<i></i>" + name;
              rows.appendChild(row);
              const t = T0 + i * GAP;
              tl.set(row, { opacity: 0 }, 0);
              tl.fromTo(p, { x: 0 }, { x: 600, duration: 0.6, ease: "power1.in", immediateRender: false }, t);
              tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, t);
              tl.to(p, { opacity: 0, duration: 0.1, ease: "none" }, t + 0.5);
              tl.fromTo(row, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t + 0.55);
              tl.fromTo("#s10-sse-dot", { x: 0, opacity: 1 }, { x: 76, opacity: 0.2, duration: 0.3, ease: "power1.in", immediateRender: false }, t + 0.6);
              tl.fromTo("#s10-log", { borderColor: "#ffb547" }, { borderColor: "#2b3a49", duration: 0.35, ease: "power2.out", immediateRender: false }, t + 0.58);
            });
            tl.set("#s10-sse-dot", { opacity: 0 }, T0 + EVENTS.length * GAP + 0.6);
            tl.fromTo(seq, { v: 0 }, {
              v: 4718, duration: EVENTS.length * GAP + 0.2, ease: "none", immediateRender: false,
              onUpdate: () => { seqEl.textContent = "#" + String(Math.round(seq.v)).padStart(4, "0"); },
            }, T0 + 0.58);

            const START = 2.5;
            tl.fromTo("#s10-stats", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, START);
            document.querySelectorAll("#s10-stats .s10-n").forEach((el, i) => {
              const to = parseFloat(el.dataset.to), sep = el.dataset.sep === "1";
              const p = { v: 0 };
              tl.fromTo(p, { v: 0 }, {
                v: to, duration: 1.4, ease: "power2.out", immediateRender: false,
                onUpdate: () => { const n = Math.round(p.v); el.textContent = sep ? n.toLocaleString("en-US") : String(n); },
              }, START + 0.2 + i * 0.12);
            });

            tl.to("#s10-band .w", { yPercent: -110, duration: 0.26, ease: "power3.in", stagger: 0.015 }, 8.2);
            tl.to("#s10-band .sub", { opacity: 0, duration: 0.2, ease: "power1.in" }, 8.25);

            window.__timelines["s10-engine"] = tl;
          })();
