        <script>
          (function () {
            const K = 1872 / 1600;
            // Puts UI point (fx, fy) at the window centre, clamped so no edge of the footage shows.
            const cam = (fx, fy, s) => {
              const hw = 936 / (K * s), hh = 409 / (K * s);
              if (hw < 800) fx = Math.min(Math.max(fx, hw), 1600 - hw);
              if (hh < 450) fy = Math.min(Math.max(fy, hh), 900 - hh);
              return { x: 936 - fx * K * s, y: 409 - fy * K * s, scale: s };
            };
            const tl = gsap.timeline({ paused: true });

            tl.fromTo("#s09-band .chap", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0);
            tl.fromTo("#s09-band .w", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power4.out", stagger: 0.04 }, 0.05);
            tl.fromTo("#s09-band .sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.4);

            tl.fromTo("#s09-cam", cam(1240, 330, 1.8), { ...cam(1240, 560, 1.8), duration: 6.5, ease: "sine.inOut" }, 0);

            const START = 4.0;
            tl.fromTo("#s09-stats", { yPercent: 130 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, START);
            document.querySelectorAll("#s09-stats .s09-n").forEach((el, i) => {
              const to = parseFloat(el.dataset.to), dec = parseInt(el.dataset.dec || "0", 10), pre = el.dataset.prefix || "";
              const p = { v: 0 };
              tl.fromTo(p, { v: 0 }, {
                v: to, duration: 0.9, ease: "power2.out", immediateRender: false,
                onUpdate: () => { el.textContent = pre + p.v.toFixed(dec); },
              }, START + 0.2 + i * 0.08);
            });

            tl.to("#s09-band .w", { yPercent: -110, duration: 0.26, ease: "power3.in", stagger: 0.015 }, 6.2);
            tl.to("#s09-band .sub", { opacity: 0, duration: 0.2, ease: "power1.in" }, 6.25);

            window.__timelines["s09-result"] = tl;
          })();
        </script>
