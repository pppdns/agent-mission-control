        <script>
          (function () {
            const K = 1872 / 1600;
            // Puts UI point (fx, fy) at the window centre, clamped so no edge of the footage shows.
            const cam = (fx, fy, s) => {
              const hw = 936 / (K * s), hh = 409 / (K * s);
              if (hw < 800) fx = Math.min(Math.max(fx, hw), 1600 - hw);
              if (hh < 450) fy = Math.min(Math.max(fy, hh), 900 - hh);
              return { x: 936 - fx * K * s, y: 409 - fy * K * s, scale: s };
            };
            const tl = gsap.timeline({ paused: true });

            tl.fromTo("#s02-band .chap", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0);

            tl.fromTo("#s02-cam1", cam(450, 400, 1.3), { ...cam(450, 430, 1.4), duration: 1.2, ease: "none" }, 0);
            tl.to("#s02-cam1", { ...cam(450, 540, 2.0), duration: 0.9, ease: "power3.inOut" }, 1.2);
            tl.to("#s02-cam1", { ...cam(455, 548, 2.1), duration: 1.2, ease: "none" }, 2.1);

            tl.to("#s02-band .w", { yPercent: -110, duration: 0.26, ease: "power3.in", stagger: 0.015 }, 6.2);
            tl.to("#s02-band .sub", { opacity: 0, duration: 0.2, ease: "power1.in" }, 6.25);

            window.__timelines["s02-plan"] = tl;
          })();
