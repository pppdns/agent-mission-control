    <style>
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("assets/fonts/BarlowCondensed-600.woff2") format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("assets/fonts/BarlowCondensed-700.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 100 900; src: url("assets/fonts/Geist-var.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url("assets/fonts/GeistMono-var.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #06080b; }
      body { font-family: "Geist", sans-serif; color: #dce4ec; -webkit-font-smoothing: antialiased; }

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #06080b; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }

      /* Ground: the app's grid and glows, at video intensity. */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #bg-grid {
        position: absolute; inset: -64px;
        background-image:
          linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .glow { position: absolute; border-radius: 50%; will-change: transform, opacity; }
      #glow-cyan { width: 1300px; height: 900px; right: -520px; top: -420px; background: radial-gradient(closest-side, rgb(79 209 230 / 0.16), transparent); }
      #glow-amber { width: 1100px; height: 800px; left: -520px; bottom: -380px; background: radial-gradient(closest-side, rgb(255 181 71 / 0.12), transparent); }

      /* Shared scene vocabulary. Scenes mount into this document, so these classes apply inside them. */
      .band { position: absolute; left: 44px; right: 44px; top: 0; height: 318px; }
      .chap { position: absolute; left: 0; top: 40px; display: flex; align-items: center; gap: 18px; height: 34px; }
      .chap-n { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 24px; color: #ffb547; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
      .chap-rule { width: 40px; height: 2px; background: #2b3a49; }
      .chap-t { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: #8896a6; }
      .hl { position: absolute; left: 0; right: 0; top: 92px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 84px; line-height: 0.96; letter-spacing: 0.004em; text-transform: uppercase; color: #dce4ec; }
      .hl .ln { display: block; overflow: hidden; padding-bottom: 4px; }
      .hl .w { display: inline-block; will-change: transform; }
      .sub { position: absolute; left: 0; right: 0; top: 272px; font-size: 31px; line-height: 1.25; color: #8896a6; font-weight: 400; }
      .sub b { color: #dce4ec; font-weight: 500; }

      .win { position: absolute; left: 24px; top: 330px; width: 1032px; height: 992px; overflow: hidden; border-radius: 6px; background: #0b0f14; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; will-change: transform; }
      .cam > video { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: fill; }

      .chip { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid; font-family: "Geist Mono", monospace; font-size: 24px; font-weight: 500; background: rgb(6 8 11 / 0.88); white-space: nowrap; }
      .chip i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; display: block; }
    </style>
  </head>
