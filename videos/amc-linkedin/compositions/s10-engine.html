            });

            const EVENTS = [

              p.setAttribute("data-layout-allow-overlap", "");

              p.style.color = color;

              const t = T0 + i * GAP;
              tl.fromTo(p, { xPercent: -50, y: 400 }, { y: 252, duration: 0.6, ease: "power1.in", immediateRender: false }, t);
              tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, t);

            tl.set("#s10-sse-dot", { opacity: 0 }, T0 + EVENTS.length * GAP + 0.6);
