          <div data-hf-id="hf-j6hi" class="chap"><span data-hf-id="hf-zc1g" class="chap-n">11 / 12</span><span data-hf-id="hf-hs16" class="chap-rule"></span><span data-hf-id="hf-7kaj" class="chap-t">Replay</span></div>
          <h1 data-hf-id="hf-sqeq" class="hl">
            <span data-hf-id="hf-smev" class="ln"><span data-hf-id="hf-4q4b" class="w">Every</span> <span data-hf-id="hf-bw6l" class="w">run</span> <span data-hf-id="hf-fj2o" class="w">is</span></span>
            <span data-hf-id="hf-oupj" class="ln"><span data-hf-id="hf-7rcn" class="w" style="color:#ffb547">replayable</span></span>
          </h1>
          <p data-hf-id="hf-y6cp" class="sub">Scrub through any run, event by event. <b data-hf-id="hf-mcaq">No LLM calls.</b></p>
        </div>

        <div data-hf-id="hf-v0ka" class="win">
          <div data-hf-id="hf-z18q" class="cam" id="s11-cam"><video data-hf-id="hf-s1pv" id="s11-v" class="clip" src="clips/main-scrub.mp4" data-start="0" data-duration="5" data-media-start="0.5" data-track-index="0" muted playsinline></video></div>
          <div data-hf-id="hf-b4ry" class="s11-callout" id="s11-k1"><span data-hf-id="hf-srl6" class="chip" style="color:#ffb547">⏪ scrubbing back through the run</span></div>
          <div data-hf-id="hf-76nx" class="s11-callout" id="s11-k2"><span data-hf-id="hf-32ms" class="chip" style="color:#ffb547">▶ jump to round 2</span></div>
        </div>

        <script>
          (function () {
            const K = 1080 / 1040;
            const cam = (fx, fy, s) => {
              const hw = 516 / (K * s), hh = 496 / (K * s);
              if (hw < 520) fx = Math.min(Math.max(fx, hw), 1040 - hw);
              if (hh < 650) fy = Math.min(Math.max(fy, hh), 1300 - hh);
              return { x: 516 - fx * K * s, y: 496 - fy * K * s, scale: s };
            };
            const tl = gsap.timeline({ paused: true });

            tl.fromTo("#s11-band .chap", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0);
            tl.fromTo("#s11-band .w", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power4.out", stagger: 0.04 }, 0.05);
            tl.fromTo("#s11-band .sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.4);

            tl.fromTo("#s11-cam", cam(360, 640, 1.2), { ...cam(380, 660, 1.3), duration: 5, ease: "sine.inOut" }, 0);

            tl.fromTo("#s11-k1", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.3);
            tl.to("#s11-k1", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 2.3);
            tl.fromTo("#s11-k2", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.65);

            tl.to("#s11-band .w", { yPercent: -110, duration: 0.26, ease: "power3.in", stagger: 0.015 }, 4.7);
            tl.to("#s11-band .sub", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.75);
            tl.to("#s11-k2", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.75);

            window.__timelines["s11-replay"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
